<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeetCode Importer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 250px;
      padding: 16px;
      margin: 0;
      background-color: #ffffff;
      color: #333333;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
    .success {
      color: #16a34a;
    }
    .error {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <h2>Import Problem</h2>
  <p style="font-size: 13px; color: #666; margin-bottom: 16px;">
    Syncs the current LeetCode problem to your local database.
  </p>
  <button id="import-btn">Import to Local DB</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
